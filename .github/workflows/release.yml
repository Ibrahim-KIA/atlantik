name: Atlantik release image
on:
  workflow_dispatch:
    inputs:
      checks_run_id:
        description: Successful Atlantik checks run for this exact commit
        required: true
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify acceptance run for current commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.checks_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > /tmp/acceptance.json
          jq -e --arg sha "$GITHUB_SHA" '.head_sha == $sha and .conclusion == "success" and .name == "Atlantik checks" and .event != "pull_request"' /tmp/acceptance.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/atlantik:${{ github.sha }}
