name: Atlantik checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run docs:api && git diff --exit-code -- docs/openapi.json docs/endpoints.md
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:failures
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: bash scripts/dev-up.sh
      - run: npm run test:smoke
      - if: always()
        run: docker compose --profile development down
