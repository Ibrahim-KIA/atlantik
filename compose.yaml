name: atlantik
x-build: &build
  context: .
services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlantik
      POSTGRES_USER: atlantik_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U atlantik_migrator -d atlantik]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      retries: 20
  migrate:
    build: *build
    image: ${ATLANTIK_IMAGE:-atlantik:local}
    command: [node, dist/migrate.js]
    environment:
      DATABASE_URL: postgresql://atlantik_migrator:${POSTGRES_PASSWORD}@database:5432/atlantik
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD}
    depends_on:
      database: {condition: service_healthy}
  api:
    build: *build
    image: ${ATLANTIK_IMAGE:-atlantik:local}
    restart: unless-stopped
    environment: &runtime
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://atlantik_app:${APP_DB_PASSWORD}@database:5432/atlantik
      REDIS_URL: redis://redis:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:?Set BILLING_WEBHOOK_SECRET}
      BILLING_MODE: ${BILLING_MODE:-provider}
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-Atlantik <noreply@example.test>}
      TRUST_PROXY: ${TRUST_PROXY:-}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 10
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    build: *build
    image: ${ATLANTIK_IMAGE:-atlantik:local}
    command: [node, dist/worker.js]
    restart: unless-stopped
    environment:
      <<: *runtime
      DATABASE_URL: postgresql://atlantik_worker:${WORKER_DB_PASSWORD}@database:5432/atlantik
    depends_on:
      api: {condition: service_healthy}
  scheduler:
    build: *build
    image: ${ATLANTIK_IMAGE:-atlantik:local}
    command: [node, dist/scheduler.js]
    restart: unless-stopped
    environment:
      <<: *runtime
      DATABASE_URL: postgresql://atlantik_worker:${WORKER_DB_PASSWORD}@database:5432/atlantik
    depends_on:
      api: {condition: service_healthy}
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ['${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80']
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      api: {condition: service_healthy}
  mail:
    image: axllent/mailpit:v1.27
    profiles: [development]
    ports: ['127.0.0.1:8025:8025']
volumes:
  postgres:
  redis:
